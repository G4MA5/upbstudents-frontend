<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // JavaScript available: the pre-rendered content stays hidden (the app replaces it).
      document.documentElement.classList.add("js");
      // Apply the saved theme before the first paint (no flash).
      try {
        if (localStorage.getItem("upb_theme") === "dark") document.documentElement.dataset.theme = "dark";
      } catch (e) {}
    </script>
    
    <!-- Balises SEO : remplacées page par page au build (seo/prerender.ts)
         et mises à jour par l'application (src/lib/useSeoHead.ts). -->
    <!--seo:start-->
    <title>UpB Student's · Bibliothèque numérique de l'UPB</title>
    <meta name="description" content="Bibliothèque numérique des étudiants de l'Université Polytechnique de Bingerville (UPB) : examens, cours, TD, TP, mémoires et livres par filière et par niveau." />
    <!--seo:end-->
    <meta name="author" content="Gama Labs" />
    <meta name="application-name" content="UpB Student's" />
    <meta name="apple-mobile-web-app-title" content="UpB Student's" />
    <link rel="author" href="/humans.txt" />
    <link rel="alternate" type="text/plain" title="Présentation pour les IA" href="/llms.txt" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <style>
      /* Pre-rendered content: read by search engines and AI crawlers, shown
         without JavaScript, replaced by the application as soon as it starts. */
      .js .ssg { display: none; }
      .ssg { max-width: 960px; margin: 0 auto; padding: 24px 16px; font-family: "Plus Jakarta Sans", system-ui, sans-serif; line-height: 1.6; color: #161618; }
      .ssg a { color: #c94f00; }
      .ssg img { max-width: 100%; height: auto; border-radius: 12px; }
    </style>

    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/png" href="/logo5.png" />
    <link rel="apple-touch-icon" href="/logo-upb-students.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Veuillez activer JavaScript pour utiliser la bibliothèque UpB Student's.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
