<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Apply the saved theme before the first paint (no flash).
      try {
        if (localStorage.getItem("upb_theme") === "dark") document.documentElement.dataset.theme = "dark";
      } catch (e) {}
    </script>
    <meta
      name="description"
      content="Bibliothèque numérique des étudiants de l'Université Polytechnique de Bingerville : examens, TD, TP et livres par filière et par niveau."
    />
    <meta name="format-detection" content="telephone=no" />
    <title>UpB Student's · Bibliothèque numérique</title>
    <link rel="icon" type="image/png" href="/logo5.png" />
    <link rel="apple-touch-icon" href="/logo5.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Veuillez activer JavaScript pour utiliser la bibliothèque UpB Student's.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
